name: github-to-gitlab-mirror

on:
  push:
  workflow_dispatch:
  schedule:
    # Dependabot-triggered runs cannot access Actions secrets. This catches them.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check mirror credential
        id: credential
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -n "${GITLAB_MIRROR_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mirror skipped because GITLAB_MIRROR_TOKEN is not configured or unavailable to this event."
          fi

      - name: Checkout GitHub repository
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mirror GitHub branches and tags to GitLab
        if: steps.credential.outputs.available == 'true'
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --prune origin \
            '+refs/heads/*:refs/mirror-source/heads/*' \
            '+refs/tags/*:refs/mirror-source/tags/*'

          askpass="${RUNNER_TEMP}/gitlab-mirror-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *Password*) printf '%s\n' "${GITLAB_MIRROR_TOKEN}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          trap 'rm -f "${askpass}"' EXIT

          git remote add gitlab https://gitlab.com/ck-os-vaults/starter.os.git

          GIT_ASKPASS="${askpass}" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git push --atomic --force --prune gitlab \
              'refs/mirror-source/heads/*:refs/heads/*' \
              'refs/mirror-source/tags/*:refs/tags/*'

          github_refs="$(mktemp)"
          gitlab_refs="$(mktemp)"
          git ls-remote --heads --tags origin | sort > "${github_refs}"
          GIT_ASKPASS="${askpass}" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git ls-remote --heads --tags gitlab | sort > "${gitlab_refs}"

          if ! diff -u "${github_refs}" "${gitlab_refs}"; then
            echo "::error::GitLab branches or tags do not exactly match GitHub."
            exit 1
          fi

          echo "Verified: GitLab branches and tags exactly match GitHub."
