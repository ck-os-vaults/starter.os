name: github-to-gitlab-mirror

on:
  push:
  workflow_dispatch:
  schedule:
    # Dependabot-triggered runs cannot access Actions secrets. This catches them.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check mirror credential
        id: credential
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -n "${GITLAB_MIRROR_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mirror skipped because GITLAB_MIRROR_TOKEN is not configured or unavailable to this event."
          fi

      - name: Checkout GitHub repository
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mirror GitHub branches and tags to GitLab
        if: steps.credential.outputs.available == 'true'
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --prune origin \
            '+refs/heads/*:refs/mirror-source/heads/*' \
            '+refs/tags/*:refs/mirror-source/tags/*'

          askpass="${RUNNER_TEMP}/gitlab-mirror-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *Password*) printf '%s\n' "${GITLAB_MIRROR_TOKEN}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          trap 'rm -f "${askpass}"' EXIT

          git remote add gitlab https://gitlab.com/ck-os-vaults/starter.os.git

          GIT_ASKPASS="${askpass}" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
            git push --atomic --force --prune gitlab \
              'refs/mirror-source/heads/*:refs/heads/*' \
              'refs/mirror-source/tags/*:refs/tags/*'

          mirror_status="$(
            GIT_ASKPASS="${askpass}" GIT_ASKPASS_REQUIRE=force GIT_TERMINAL_PROMPT=0 \
              git push --dry-run --porcelain --force --prune gitlab \
                'refs/mirror-source/heads/*:refs/heads/*' \
                'refs/mirror-source/tags/*:refs/tags/*'
          )"
          printf '%s\n' "${mirror_status}"

          mirrored_ref_statuses="$(
            printf '%s\n' "${mirror_status}" | awk '/^[ =*+!-][[:space:]].*:.*/ { print }'
          )"

          if [ -z "${mirrored_ref_statuses}" ]; then
            echo "::error::GitLab dry-run returned no mirrored ref statuses."
            exit 1
          fi

          if ! printf '%s\n' "${mirrored_ref_statuses}" | awk 'substr($0, 1, 1) != "=" { exit 1 }'; then
            echo "::error::GitLab dry-run found mirrored refs that are not up to date."
            exit 1
          fi

          echo "Verified: all mirrored branches and tags are up to date after the atomic push."
